name: CI

on:
  push:
    branches:
      - main

  pull_request:

env:
  BUNDLE_WITHOUT: 'development'

jobs:
  rubocop:
    runs-on: ubuntu-latest
    name: RuboCop (Ruby ${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby and bundle
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop

  rspec:
    runs-on: ubuntu-latest
    name: RSpec (Ruby ${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby and bundle
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: RSpec
        env:
          COVERAGE: true
        run: bundle exec rspec
