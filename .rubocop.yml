plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'lib/guard/boondoc/templates/*'

Metrics/BlockLength:
  AllowedMethods:
    - describe
    - context

Style/SymbolArray:
  MinSize: 3

Style/WordArray:
  MinSize: 3
